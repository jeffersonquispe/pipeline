<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Snake Demo</title>
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #0b1220;
      color: #e6edf7;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    .wrap {
      width: min(720px, 92vw);
      display: grid;
      gap: 12px;
    }
    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 12px;
      backdrop-filter: blur(6px);
    }
    .hud-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .title {
      font-weight: 700;
      letter-spacing: 0.2px;
      font-size: 14px;
      opacity: 0.95;
    }
    .score {
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      opacity: 0.9;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    button {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.08);
      color: #e6edf7;
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }
    button:hover {
      background: rgba(255, 255, 255, 0.12);
    }
    button:active {
      transform: translateY(1px);
    }
    .hint {
      font-size: 12px;
      opacity: 0.75;
      white-space: nowrap;
    }
    canvas {
      width: 100%;
      height: auto;
      border-radius: 14px;
      background: #0a0f1a;
      border: 1px solid rgba(255, 255, 255, 0.10);
      display: block;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hud">
      <div class="hud-left">
        <div class="title">Snake</div>
        <div class="score">Puntaje: <span id="scoreEl">0</span></div>
      </div>
      <div class="controls">
        <div class="hint">Flechas o WASD</div>
        <button id="resetBtn" type="button">Reiniciar</button>
      </div>
    </div>

    <canvas id="gameCanvas" width="600" height="420" aria-label="Snake canvas"></canvas>
  </div>

  <script>
    'use strict';

    // Constants
    const CELL_SIZE = 20;
    const TICK_MS = 110;

    const BG_COLOR = '#0a0f1a';
    const GRID_COLOR = 'rgba(255,255,255,0.06)';
    const SNAKE_HEAD_COLOR = '#67e8f9';
    const SNAKE_BODY_COLOR = '#22c55e';
    const FOOD_COLOR = '#fb7185';

    const OVERLAY_BG = 'rgba(0,0,0,0.55)';
    const OVERLAY_TEXT = '#ffffff';

    const DIRS = Object.freeze({
      up: { x: 0, y: -1, name: 'up' },
      down: { x: 0, y: 1, name: 'down' },
      left: { x: -1, y: 0, name: 'left' },
      right: { x: 1, y: 0, name: 'right' }
    });

    const OPPOSITE = Object.freeze({
      up: 'down',
      down: 'up',
      left: 'right',
      right: 'left'
    });

    // DOM
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const scoreEl = document.getElementById('scoreEl');
    const resetBtn = document.getElementById('resetBtn');

    // State
    const state = {
      cols: Math.floor(canvas.width / CELL_SIZE),
      rows: Math.floor(canvas.height / CELL_SIZE),
      snake: [],
      dir: DIRS.right,
      nextDir: DIRS.right,
      food: { x: 0, y: 0 },
      score: 0,
      gameOver: false,
      timerId: null
    };

    function posKey(p) {
      return `${p.x},${p.y}`;
    }

    function stopLoop() {
      if (state.timerId !== null) {
        clearInterval(state.timerId);
        state.timerId = null;
      }
    }

    function startLoop() {
      stopLoop();
      state.timerId = window.setInterval(() => {
        step();
        render();
      }, TICK_MS);
    }

    function resetGame() {
      stopLoop();

      state.score = 0;
      state.gameOver = false;

      const startX = Math.floor(state.cols / 2);
      const startY = Math.floor(state.rows / 2);

      state.snake = [
        { x: startX, y: startY },
        { x: startX - 1, y: startY },
        { x: startX - 2, y: startY }
      ];

      state.dir = DIRS.right;
      state.nextDir = DIRS.right;

      spawnFood();

      scoreEl.textContent = String(state.score);
      render();
      startLoop();
    }

    function spawnFood() {
      const occupied = new Set(state.snake.map(posKey));

      const freeCells = [];
      for (let y = 0; y < state.rows; y++) {
        for (let x = 0; x < state.cols; x++) {
          const key = `${x},${y}`;
          if (!occupied.has(key)) freeCells.push({ x, y });
        }
      }

      if (freeCells.length === 0) {
        // No space left: treat as game over (win condition).
        state.gameOver = true;
        stopLoop();
        return;
      }

      const idx = Math.floor(Math.random() * freeCells.length);
      state.food = freeCells[idx];
    }

    function setDirection(dirName) {
      if (!DIRS[dirName]) return;
      if (state.gameOver) return;

      const desired = DIRS[dirName];
      const current = state.dir;

      // No immediate reverse.
      if (OPPOSITE[current.name] === desired.name) return;

      state.nextDir = desired;
    }

    function step() {
      if (state.gameOver) return;

      // Apply buffered direction
      state.dir = state.nextDir;

      const head = state.snake[0];
      const newHead = {
        x: head.x + state.dir.x,
        y: head.y + state.dir.y
      };

      // Border collision
      const hitBorder =
        newHead.x < 0 ||
        newHead.x >= state.cols ||
        newHead.y < 0 ||
        newHead.y >= state.rows;

      if (hitBorder) {
        state.gameOver = true;
        stopLoop();
        return;
      }

      // Self collision (compare with existing segments)
      for (let i = 0; i < state.snake.length; i++) {
        const seg = state.snake[i];
        if (seg.x === newHead.x && seg.y === newHead.y) {
          state.gameOver = true;
          stopLoop();
          return;
        }
      }

      // Move
      state.snake.unshift(newHead);

      const ateFood = newHead.x === state.food.x && newHead.y === state.food.y;
      if (ateFood) {
        state.score += 1;
        scoreEl.textContent = String(state.score);
        spawnFood(); // Keep tail (grow)
      } else {
        state.snake.pop(); // Normal move (remove tail)
      }
    }

    function drawCell(x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
    }

    function renderGrid() {
      ctx.strokeStyle = GRID_COLOR;
      ctx.lineWidth = 1;

      for (let x = 1; x < state.cols; x++) {
        const px = x * CELL_SIZE + 0.5;
        ctx.beginPath();
        ctx.moveTo(px, 0);
        ctx.lineTo(px, state.rows * CELL_SIZE);
        ctx.stroke();
      }

      for (let y = 1; y < state.rows; y++) {
        const py = y * CELL_SIZE + 0.5;
        ctx.beginPath();
        ctx.moveTo(0, py);
        ctx.lineTo(state.cols * CELL_SIZE, py);
        ctx.stroke();
      }
    }

    function renderOverlay() {
      if (!state.gameOver) return;

      ctx.fillStyle = OVERLAY_BG;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = OVERLAY_TEXT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.font = '700 28px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif';
      ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 14);

      ctx.font = '500 14px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif';
      ctx.fillText('Pulsa Reiniciar para jugar de nuevo', canvas.width / 2, canvas.height / 2 + 18);
    }

    function render() {
      ctx.fillStyle = BG_COLOR;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      renderGrid();

      // Food
      drawCell(state.food.x, state.food.y, FOOD_COLOR);

      // Snake
      for (let i = state.snake.length - 1; i >= 0; i--) {
        const seg = state.snake[i];
        const color = i === 0 ? SNAKE_HEAD_COLOR : SNAKE_BODY_COLOR;
        drawCell(seg.x, seg.y, color);
      }

      renderOverlay();
    }

    function handleKeydown(e) {
      const key = e.key;

      const mapping = {
        ArrowUp: 'up',
        ArrowDown: 'down',
        ArrowLeft: 'left',
        ArrowRight: 'right',
        w: 'up',
        s: 'down',
        a: 'left',
        d: 'right',
        W: 'up',
        S: 'down',
        A: 'left',
        D: 'right'
      };

      const dirName = mapping[key];
      if (!dirName) return;

      // Prevent page scrolling on Arrow keys (and allow consistent behavior for WASD)
      e.preventDefault();
      setDirection(dirName);
    }

    resetBtn.addEventListener('click', resetGame);
    window.addEventListener('keydown', handleKeydown);

    resetGame();
  </script>
</body>
</html>
